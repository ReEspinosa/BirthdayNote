    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}
  .escenario img{position:absolute;display:block;pointer-events:none}

  /* texto dentro de la placa */
  .texto{position:absolute;left:175px;top:200px;width:845px;height:620px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
  .titulo{position:static !important;width:540px;margin:0 0 4px;clip-path:inset(0 100% 0 0);animation:escribir 2.4s cubic-bezier(.45,.05,.4,1) .9s forwards;filter:drop-shadow(0 2px 0 rgba(255,255,255,.6))}
  @keyframes escribir{to{clip-path:inset(0 0 0 0)}}
  @media (prefers-reduced-motion:reduce){.titulo{clip-path:none}}
  .adorno{width:330px;height:14px;margin:6px 0 14px;animation:aparece 1s ease-out 2.9s both}
  .mensaje{margin:0;font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:44px;line-height:1.28;max-width:700px;
    animation:sube 1s ease-out both;animation-delay:calc(2.9s + var(--i)*.35s)}
  .mensaje em{font-weight:700;color:var(--rosa)}
  .firma{margin:18px 0 0;font-family:var(--f-serif);font-weight:600;font-size:30px;letter-spacing:.18em;text-transform:uppercase;
    animation:sube 1s ease-out 4.1s both}
  .firma b{font-style:italic;font-weight:700;font-size:54px;letter-spacing:.04em;color:var(--rosa);margin-left:8px;vertical-align:-4px}
  @keyframes sube{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes aparece{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}

  /* candelabro */
  .candelabro{left:1330px;top:-34px;width:330px;transform-origin:50% 0;
    animation:baja 1.2s cubic-bezier(.2,.9,.3,1.25) both, columpio 5s ease-in-out 1.2s infinite}
  @keyframes baja{from{transform:translateY(-110%)}to{transform:none}}
  @keyframes columpio{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}

  /* pastel */
  .pastel{position:absolute;left:1220px;top:410px;width:560px;height:626px;border:0;padding:0;background:none;cursor:pointer;
    animation:pop 1s cubic-bezier(.2,.9,.3,1.25) 1.5s both}
  .pastel:focus-visible{outline:4px dashed var(--rosa);outline-offset:8px;border-radius:16px}
  .pastel>img{position:static !important;width:100%;filter:drop-shadow(0 14px 18px rgba(91,56,67,.22))}
  @keyframes pop{from{opacity:0;transform:scale(.6) translateY(40px)}to{opacity:1;transform:none}}
  .vela{position:absolute;top:9.9%;width:8.2%;transform:translate(-50%,-100%);pointer-events:none}
  .vela .luz{position:absolute;left:50%;bottom:10%;width:330%;aspect-ratio:1;translate:-50% 30%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,214,120,.8) 0,rgba(255,190,90,.28) 38%,transparent 68%);
    animation:brillo var(--v,1.3s) ease-in-out infinite alternate}
  .vela .flama{position:relative !important;width:100%;transform-origin:50% 92%;animation:fuego var(--v,1.3s) ease-in-out infinite alternate}
  @keyframes fuego{0%{transform:rotate(-6deg) scaleY(1) skewX(3deg)}25%{transform:rotate(5deg) scaleY(1.12) skewX(-4deg)}
    50%{transform:rotate(-3deg) scaleY(.93) skewX(5deg)}75%{transform:rotate(7deg) scaleY(1.08) skewX(-3deg)}100%{transform:rotate(-2deg) scaleY(1.02) skewX(2deg)}}
  @keyframes brillo{from{opacity:.6;scale:.9}to{opacity:1;scale:1.15}}

  /* decoración */
  .ramo{left:1735px;top:300px;width:230px;transform-origin:50% 100%;animation:flotar 4.6s ease-in-out infinite alternate}
  .globo{animation:flotar 4s ease-in-out infinite alternate;transform-origin:50% 0}
  @keyframes flotar{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-22px) rotate(3deg)}}
  .estrella{animation:titila var(--v,3s) ease-in-out infinite;animation-delay:var(--d,0s)}
  @keyframes titila{0%,100%{transform:scale(.8) rotate(0)}50%{transform:scale(1.12) rotate(18deg)}}
  .destello{animation:girar 10s linear infinite, latido 1.8s ease-in-out infinite}
  @keyframes girar{to{rotate:360deg}}
  @keyframes latido{0%,100%{scale:.85}50%{scale:1.08}}

  #confeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important}}
</style>
</head>
<body>
<canvas id="confeti" aria-hidden="true"></canvas>

<script>
(function(){
  var esc=document.getElementById('escenario');
  function ajustar(){esc.style.setProperty('--s',Math.min(innerWidth/1920,innerHeight/1080));}
  ajustar(); addEventListener('resize',ajustar);


  var cv=document.getElementById('confeti'), cx=cv.getContext('2d'), piezas=[], dpr=Math.min(devicePixelRatio||1,2), corriendo=false;
  var colores=['#c94f6d','#f3b3c2','#e7c46a','#f7e2a6','#9db7e4','#ffffff','#e8a07a'];
  function medir(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;} medir(); addEventListener('resize',medir);
  var quieto=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function lanzar(x,y,n){
    if(quieto)return;
    for(var k=0;k<n;k++){var a=Math.random()*Math.PI*2,v=4+Math.random()*9;
      piezas.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,r:Math.random()*3,vr:(Math.random()-.5)*.3,w:6+Math.random()*7,h:4+Math.random()*6,c:colores[k%colores.length],f:Math.random()<.35,vida:0});}
    if(!corriendo){corriendo=true;requestAnimationFrame(paso);}
  }
  function paso(){
    cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
    piezas=piezas.filter(function(p){return p.y<innerHeight+40&&p.vida<420;});
    piezas.forEach(function(p){p.vy+=.22;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vida++;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
      if(p.f){cx.beginPath();cx.arc(0,0,p.w/2.4,0,7);cx.fill();} else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2))+1);
      cx.restore();});
    if(piezas.length)requestAnimationFrame(paso); else {corriendo=false;cx.clearRect(0,0,innerWidth,innerHeight);}
  }
  setTimeout(function(){lanzar(innerWidth*.3,innerHeight*.3,90);lanzar(innerWidth*.75,innerHeight*.3,90);},1400);
  document.getElementById('pastel').addEventListener('click',function(){var b=this.getBoundingClientRect();lanzar(b.left+b.width/2,b.top+b.height*.15,140);});
})();
</script>
